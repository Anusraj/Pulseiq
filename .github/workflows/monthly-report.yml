name: Monthly PulseIQ report

on:
  schedule:
    # 06:00 UTC on the first day of each month; the prior month is reported.
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to report (YYYY-MM); blank means previous month"
        required: false
        type: string

jobs:
  build-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r phase4/task-16/requirements.txt
      - name: Choose reporting month
        id: month
        shell: bash
        run: |
          if [ -n "${{ inputs.month }}" ]; then
            echo "month=${{ inputs.month }}" >> "$GITHUB_OUTPUT"
          else
            echo "month=$(date -u -d '1 month ago' +%Y-%m)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build report
        run: |
          python etl.py
          python warehouse.py
          python metrics.py
          python phase4/task-16/build_report.py --month "${{ steps.month.outputs.month }}"
      - name: Publish governed aggregate snapshot
        run: python publish_public_data.py
      - name: Commit refreshed public snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pulseiq_public.duckdb
          if git diff --cached --quiet; then
            echo "Public snapshot unchanged."
          else
            git commit -m "Refresh public dashboard data"
            git push
          fi
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pulseiq-report-${{ steps.month.outputs.month }}
          path: phase4/task-16/reports/pulseiq-${{ steps.month.outputs.month }}.pdf
